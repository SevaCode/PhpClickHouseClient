name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite unit
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  integration:
    name: Integration / ClickHouse ${{ matrix.clickhouse }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ['24.1', '24.8', 'latest']
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 8123:8123
    env:
      CLICKHOUSE_URL: http://localhost:8123/
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 1
          done
          exit 1
      - run: vendor/bin/phpunit --testsuite integration
